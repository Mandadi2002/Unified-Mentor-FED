<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Image Slider</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="slider-container" id="slider1">
    <div class="slider">
      <img src="images/House Plan-1.jpg" class="slide active" alt="Image 1">
      <img src="images/House Plan-2.jpg" class="slide" alt="Image 2">
      <img src="images/House Plan-3.png" class="slide" alt="Image 3">
      <img src="images/House Plan-4.jpg" class="slide " alt="Image 4">
      <img src="images/House Plan-5.jpg" class="slide" alt="Image 5">
      <img src="images/House Plan-6.jpg" class="slide" alt="Image 6">
      <img src="images/House Plan-7.jpg" class="slide" alt="Image 7">
      <img src="images/House Plan-8.jpg" class="slide" alt="Image 8">
      <img src="images/House Plan-9.jpg" class="slide" alt="Image 9">
      <img src="images/House Plan-10.jpg" class="slide" alt="Image 10">
      <img src="images/House Plan-11.jpg" class="slide" alt="Image 11">
      <img src="images/House Plan-12.jpg" class="slide" alt="Image 12">
    </div>
  </div>
  <button class="prev" onclick="changeSlide(-1)">❮</button>
  <button class="next" onclick="changeSlide(1)">❯</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
